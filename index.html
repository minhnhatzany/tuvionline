<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tử Vi Online</title>
<style>
:root{--void:#050505;--void-2:#111;--cell:#1a1a1a;--cell-hi:#252525;--line:rgba(255,255,255,.1);--gold:#c4a265;--cinnabar:#a83e35;--jade:#4fa88c;--azure:#5b8fd4;--amber:#dd9440;--txt:#d0d0d0;--dim:#888;--dimmer:#555}
*{box-sizing:border-box;margin:0;padding:0}
#suong{position:fixed;inset:-25%;z-index:-2;pointer-events:none;overflow:hidden}
#suong i{position:absolute;display:block;border-radius:50%;opacity:.4;will-change:transform}
#suong i:nth-child(1){width:70vw;height:70vw;left:-12vw;top:-18vw;background:radial-gradient(circle,rgba(255,255,255,.05),transparent 60%);animation:troi1 64s ease-in-out infinite}
#suong i:nth-child(2){width:62vw;height:62vw;right:-14vw;top:22vh;background:radial-gradient(circle,rgba(196,162,101,.03),transparent 60%);animation:troi2 86s ease-in-out infinite}
#suong i:nth-child(3){width:78vw;height:78vw;left:8vw;bottom:-30vw;background:radial-gradient(circle,rgba(255,255,255,.04),transparent 60%);animation:troi3 104s ease-in-out infinite}
@keyframes troi1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(9vw,7vh) scale(1.18)}}
@keyframes troi2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-8vw,-6vh) scale(.92)}}
@keyframes troi3{0%,100%{transform:translate(0,0) scale(.95)}50%{transform:translate(6vw,-9vh) scale(1.14)}}
#sao{position:fixed;inset:0;z-index:-3;pointer-events:none}
#sao b{position:absolute;width:1px;height:1px;border-radius:50%;background:#fff;animation:nhapnhay 4s ease-in-out infinite}
@keyframes nhapnhay{0%,100%{opacity:.1}50%{opacity:.6}}
@keyframes hienlen{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
body{background:var(--void);overflow-x:hidden;color:var(--txt);font-family:'Times New Roman',Times,serif;min-height:100vh;padding:15px 10px 50px;-webkit-font-smoothing:antialiased;line-height:1.4}
.wrap{max-width:1000px;margin:0 auto;position:relative;z-index:1}
header{text-align:center;margin-bottom:15px}
.bagua{font-size:18px;color:var(--gold);letter-spacing:6px;opacity:.5;margin-bottom:4px}
header h1{font-weight:bold;text-shadow:0 0 25px rgba(196,162,101,.3),0 0 50px rgba(196,162,101,.1);font-size:48px;letter-spacing:.05em;line-height:1;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
header .sub{font-size:14px;color:var(--dimmer);margin-top:4px;letter-spacing:.15em}
#ad-banner{display:block;margin:0 auto 15px;max-width:600px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:2px;padding:10px 15px;text-decoration:none;color:var(--txt);text-align:center;font-size:16px;transition:.3s;box-shadow:inset 0 0 15px rgba(0,0,0,.5)}
#ad-banner:hover{background:rgba(196,162,101,.08);border-color:rgba(196,162,101,.4)}
#ad-banner b{color:var(--gold);font-size:18px;margin:0 4px}
.ad-tag{font-size:12px;background:#222;color:#999;padding:2px 5px;border:1px solid #444;margin-right:6px;vertical-align:1px}
.phan-box{margin-top:12px;padding:14px 18px;background:rgba(196,162,101,.05);border-left:3px solid var(--gold);font-size:16px;color:#ddd;line-height:1.6}
.phan-box b{color:var(--gold)}.phan-box .bad{color:var(--cinnabar)}.phan-box .good{color:var(--jade)}
.phan-box ul { padding-left: 15px; margin-bottom: 15px; }
.phan-box li { margin-bottom: 8px; }
.tabs{display:flex;gap:4px;justify-content:center;margin-bottom:15px}
.tab{padding:8px 16px;font-size:16px;cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--dim);transition:.2s}
.tab.on{background:rgba(255,255,255,.1);border-color:#666;color:#fff}
.panel{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:flex-end;background:rgba(255,255,255,.02);border:1px solid var(--line);padding:12px;margin-bottom:15px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:14px;color:var(--dimmer);font-style:italic}
.f input,.f select{background:var(--void-2);border:1px solid var(--line);color:var(--txt);padding:0 8px;font:inherit;font-size:16px;min-width:120px;height:34px}
.f input:focus,.f select:focus{outline:1px solid #666;border-color:#666}
button{background:#222;color:#eee;border:1px solid #555;padding:0 16px;cursor:pointer;font:inherit;font-size:16px;transition:.2s;height:34px;display:flex;align-items:center}
button:hover{background:#333;color:#fff}
.err{color:var(--cinnabar);font-size:15px;text-align:center;margin-bottom:10px;min-height:16px;font-style:italic}
h3{font-weight:normal;font-size:22px;margin:20px 0 12px;color:#eee;display:flex;align-items:center;gap:15px}
h3::after{content:'';flex:1;height:1px;background:var(--line)}
.card{background:var(--cell);border:1px solid var(--line);padding:10px 15px;margin-bottom:6px}
.card .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:2px}
.card .t{font-size:16px;color:#fff}.card .why{font-size:15px;color:var(--dim)}.card .why b{color:#ccc}
.v{font-size:14px;padding:1px 6px;white-space:nowrap;border:1px solid transparent}
.v.good{color:var(--jade);border-color:rgba(79,168,140,.3)}.v.bad{color:var(--cinnabar);border-color:rgba(168,62,53,.3)}.v.mid{color:var(--gold);border-color:rgba(196,162,101,.3)}
.tally{background:var(--cell-hi);border:1px solid #333;padding:12px 15px;margin-bottom:6px}
.tally .big{font-size:17px;color:#fff;margin-bottom:4px}.tally .note{font-size:15px;color:var(--dim)}
.gl{border-bottom:1px dotted var(--dim);cursor:help;color:#aaa}
#tip{position:fixed;z-index:99;max-width:300px;background:#111;border:1px solid #444;padding:10px 12px;font-size:15px;color:#ccc;box-shadow:0 10px 20px rgba(0,0,0,.8);display:none}
#tip b{color:var(--gold);font-size:16px;display:block;margin-bottom:3px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;padding:8px 10px;font-size:14px;color:var(--dimmer);border-bottom:1px solid var(--line);font-weight:normal;font-style:italic}
td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.03)}
.ok{color:var(--jade)}.no{color:var(--cinnabar)}.wa{color:var(--gold)}
.mon{margin-bottom:15px}.mon h4{font-size:15px;font-weight:normal;color:var(--dim);margin-bottom:6px;font-style:italic}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow{font-size:13px;text-align:center;color:var(--dimmer);padding-bottom:2px}
.dd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;background:rgba(255,255,255,.02);color:var(--dimmer);border:1px solid transparent;cursor:default}
.dd small{font-size:12px;opacity:.5}
.dd.good{background:rgba(79,168,140,.1);border-color:rgba(79,168,140,.3);color:#fff;cursor:pointer}
.dd.good:hover,.dd.good:focus{background:rgba(79,168,140,.2);outline:none;transform:scale(1.05)}
.dd.blank{background:none;border:none}
#dayinfo{background:var(--cell-hi);border:1px solid #444;padding:12px 15px;margin-top:8px;font-size:16px;display:none}
#dayinfo b{color:#fff}
.hide{display:none}
#ban{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.cung{background:rgba(15,15,15,.9);min-height:160px;padding:6px;position:relative;display:flex;flex-direction:column;transition:.2s ease-out;cursor:pointer;animation:hienlen .5s ease-out backwards}
.cung:hover{background:rgba(25,25,25,.95)}
.cung.menh{background:#1a1a1a}
.cung.than::before{content:'THÂN';position:absolute;top:6px;right:6px;font-size:11px;color:var(--gold)}
.cung.dai-van{background:rgba(196,162,101,.07);border-top:2px solid var(--gold)}
.cung.tamhop{box-shadow:inset 0 0 0 1px rgba(196,162,101,.4)}
.cung.xung{box-shadow:inset 0 0 0 1px rgba(168,62,53,.4)}
.cung.focus{background:#222;box-shadow:inset 0 0 0 1px #666}
.cung .top{display:flex;justify-content:space-between;align-items:center;gap:2px;margin-bottom:4px}
.cung .tl{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tt-tag{font-size:11px;padding:0 3px;border:1px solid transparent}
.tt-tag.tuan,.tt-tag.triet{color:#aaa;border-color:#444}
.tt-tag.lh{color:var(--amber);border-color:rgba(221,148,64,.3)}
.tt-tag.lt{color:var(--jade);border-color:rgba(79,168,140,.3)}
.tt-tag.dv{color:var(--gold);border-color:rgba(196,162,101,.4)}
.cung .ten{font-size:12px;text-transform:uppercase;color:var(--dim)}.cung .cc{font-size:12px;color:var(--dimmer);font-style:italic}
.stars{margin-top:2px;display:flex;flex-wrap:wrap;gap:2px 6px;align-content:flex-start;flex:1}
.s{font-size:15px;line-height:1.2;white-space:nowrap}
.s.chinh{font-size:17px;color:#fff}.s.phu{color:#aaa}.s.sat{color:#955}.s.cat{color:#aa9}
.mh{font-size:12px;padding:0 2px;margin-left:3px;vertical-align:1px;border:1px solid transparent}
.mh.M{color:#ddd;border-color:#555}.mh.V{color:#bbb;border-color:#444}.mh.D{color:#999;border-color:#333}.mh.B{color:#777;border-color:#222}.mh.H{color:#555;border-color:#222}.mh.chua{opacity:.5;border-style:dotted}
.mh-leg{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:14px;color:var(--dimmer);font-style:italic}
.hoa{font-size:11px;padding:0 2px;margin-left:3px;color:#000}
.hoa.loc{background:var(--jade)}.hoa.quyen{background:var(--amber)}.hoa.khoa{background:var(--azure)}.hoa.ky{background:var(--cinnabar);color:#fff}
.s.luu{font-size:14px;color:#ccc}
.s.vong{color:var(--dimmer);font-size:13px}
.vong-group{display:flex;flex-wrap:wrap;gap:1px 6px;margin-top:auto;border-top:1px solid rgba(255,255,255,.05);padding-top:2px;margin-bottom:2px}
.van{position:absolute;bottom:4px;left:6px;right:6px;display:flex;justify-content:space-between;font-size:13px;color:var(--dimmer)}
#center{grid-column:2/4;grid-row:2/4;background:var(--void-2);padding:15px;position:relative}
#center h2{font-size:22px;font-weight:normal;margin-bottom:10px;color:#ddd;text-align:center}
.row{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:2px 0}
.row span:first-child{color:var(--dimmer);font-style:italic}.row span:last-child{color:#ccc}.row.hl span:last-child{color:var(--gold)}
footer{text-align:center;margin-top:30px;padding:15px;border-top:1px solid var(--line);color:var(--dimmer);font-size:14px}
footer button{margin:0 auto 8px;display:flex}
@media(max-width:700px){body{padding:10px 5px 30px}.cung{min-height:120px;padding:4px}.tt-tag{font-size:10px}.s.vong{font-size:11px}.cung .ten,.cung .cc{font-size:10px}.s.chinh{font-size:15px}.s.phu{font-size:13px}.stars{gap:1px 4px}#center{padding:10px}#center h2{font-size:18px}.row{font-size:13px}.van{font-size:11px;left:4px;right:4px}.f input,.f select{min-width:100%}header h1{font-size:36px}}
</style>
</head>
<body>
<div id="sao"></div>
<div id="suong"><i></i><i></i><i></i></div>
<div class="wrap">
<header>
  <div class="bagua">☰ ☱ ☲ ☳ ☴ ☵ ☶ ☷</div>
  <h1>☯ Tử Vi Online</h1>
  <div class="sub">A N &nbsp; S A O &nbsp;·&nbsp; L U Ậ N &nbsp; S Ố &nbsp;·&nbsp; T R Ạ C H &nbsp; C Á T</div>
</header>
<a href="https://huyetchieuhoa.netlify.app" target="_blank" id="ad-banner"><span class="ad-tag">Góc truyện hay</span><b>Huyết Chiêu Hoa</b> — Thế giới kỳ ảo, âm dương luân chuyển. Đọc thử ngay!</a>
<div class="tabs">
  <div class="tab on" data-tab="cuoi" tabindex="0">Cưới hỏi</div>
  <div class="tab" data-tab="laso" tabindex="0">Lá số</div>
  <div class="tab" data-tab="nha" tabindex="0">Làm nhà</div>
  <div class="tab" data-tab="ma" tabindex="0">Tang lễ</div>
</div>
<div id="pane-cuoi">
  <div class="panel">
    <div class="f"><label>Ngày sinh cô dâu</label><input type="date" id="bDob" value="1998-02-01"></div>
    <div class="f"><label>Ngày sinh chú rể</label><input type="date" id="gDob" value="1996-06-12"></div>
    <div class="f"><label>Cưới từ năm</label><input type="number" id="y1" value="2026" min="1900" max="2100"></div>
    <div class="f"><label>Đến năm</label><input type="number" id="y2" value="2027" min="1900" max="2100"></div>
    <div class="f"><label>&nbsp;</label><button type="button" id="btnCuoi">Tra cứu</button></div>
  </div>
  <div class="err" id="errCuoi"></div><div id="outCuoi"></div>
</div>
<div id="pane-laso" class="hide">
  <div class="panel">
    <div class="f"><label>Ngày sinh (dương)</label><input type="date" id="lDob" value="1998-02-01"></div>
    <div class="f"><label>Giờ sinh</label><select id="lHour"></select></div>
    <div class="f"><label>Giới tính</label><select id="lSex"><option value="nam">Nam</option><option value="nu">Nữ</option></select></div>
    <div class="f"><label>Năm xem hạn</label><input type="number" id="lXemY" value="2026" min="1900" max="2100"></div>
    <div class="f"><label>&nbsp;</label><button type="button" id="btnLaso">Lập lá số</button></div>
  </div>
  <div class="err" id="errLaso"></div>
  <div id="ban"></div>
  <div class="mh-leg"><span><span class="mh M">M</span> Miếu</span><span><span class="mh V">V</span> Vượng</span><span><span class="mh D">Đ</span> Đắc</span><span><span class="mh B">B</span> Bình</span><span><span class="mh H">H</span> Hãm</span></div>
  <div id="outLaso"></div>
</div>
<div id="pane-nha" class="hide">
  <div class="panel">
    <div class="f"><label>Ngày sinh chủ nhà</label><input type="date" id="nDob" value="1990-01-01"></div>
    <div class="f"><label>Giới tính</label><select id="nSex"><option value="nam">Nam</option><option value="nu">Nữ</option></select></div>
    <div class="f"><label>Năm định xây</label><input type="number" id="nY" value="2026" min="1900" max="2100"></div>
    <div class="f"><label>&nbsp;</label><button type="button" id="btnNha">Tra cứu</button></div>
  </div>
  <div class="err" id="errNha"></div><div id="outNha"></div>
</div>
<div id="pane-ma" class="hide">
  <div class="panel">
    <div class="f"><label>Ngày sinh</label><input type="date" id="maDob" value="1950-01-01"></div>
    <div class="f"><label>Ngày mất</label><input type="date" id="maDeath" value="2026-05-15"></div>
    <div class="f"><label>Giờ mất</label><select id="maHour"></select></div>
    <div class="f"><label>Giới tính</label><select id="maSex"><option value="nam">Nam</option><option value="nu">Nữ</option></select></div>
    <div class="f"><label>&nbsp;</label><button type="button" id="btnMa">Tra cứu</button></div>
  </div>
  <div class="err" id="errMa"></div><div id="outMa"></div>
</div>
<div id="tip"></div>
<footer>
  <button onclick="navigator.clipboard.writeText(location.href);this.textContent='✓ Đã copy link!'">📋 Chia sẻ lá số</button>
  <div>☯ Tử Vi Online · Đức năng thắng số ☯</div>
</footer>
</div>
<script>
/* ═══ BẦU TRỜI SAO ═══ */
const bg=document.getElementById('sao');let _s='';for(let i=0;i<150;i++)_s+=`<b style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s"></b>`;bg.innerHTML=_s;

/* ═══ TỪ ĐIỂN PHÁN (CẬP NHẬT CHI TIẾT & CÓ TÂM) ═══ */
const PHAN_SAO={
  "Tử Vi":"Đế tinh cai quản bầu trời. Khí chất trọng hậu, điềm đạm, có tài lãnh đạo thiên bẩm. Thường gặp quý nhân phù trợ, phùng hung hóa cát. Tuy nhiên, nếu thiếu các sao Tả Hữu hội họp, đôi khi sẽ hơi bảo thủ và ôm đồm công việc.",
  "Thiên Cơ":"Phúc thiện tinh chủ về trí tuệ. Tư duy mưu cơ linh hoạt, tính toán nhanh nhạy, rất hợp với các công việc tham mưu, kỹ thuật, chiến lược. Người nhạy bén nhưng đôi khi hay lo nghĩ thái quá, cần học cách thả lỏng tinh thần.",
  "Thái Dương":"Quyền quý tinh mang nguồn năng lượng ấm áp. Tính cách quang minh chính đại, hào sảng, thích lo toan việc lớn. Rất có tài ngoại giao, tuy nhiên đôi khi hơi nóng nảy và thích ôm rơm rặm bụng.",
  "Vũ Khúc":"Đệ nhất tài tinh. Bản tính cương nghị, kiên quyết, làm việc dứt khoát. Cực kỳ nhạy bén với tiền bạc, có tài kinh doanh và quản lý tài chính xuất sắc. Bề ngoài có vẻ lạnh lùng nhưng bên trong rất trọng tình nghĩa.",
  "Thiên Đồng":"Phúc tinh mang lại sự bình an. Ôn hòa, hiền hậu, mang tâm hồn nghệ sĩ và biết hưởng thụ cuộc sống. Tính tình không thích tranh giành, chuộng thanh nhàn. Cần rèn luyện thêm tính kiên định.",
  "Liêm Trinh":"Đào hoa và Tù tinh. Bộc trực, thẳng thắn, làm việc đầy trách nhiệm và đam mê. Có sức hút mãnh liệt. Tuy nhiên tính cách đôi lúc bốc đồng, cần cẩn trọng trong các mối quan hệ tình cảm và pháp lý.",
  "Thiên Phủ":"Tài khố tinh - kho chứa tiền của trời. Tính cách cẩn trọng, bao dung, chín chắn. Có biệt tài quản lý, giữ tiền xuất sắc, rất biết vun vén cho gia đình.",
  "Thái Âm":"Phú tinh chủ về điền sản. Nhẹ nhàng, tinh tế, lãng mạn và vô cùng nhạy cảm. Rất có duyên với nhà đất, nghệ thuật và cái đẹp. Bản tính thích sự chỉn chu, chăm lo người khác chu đáo.",
  "Tham Lang":"Đào hoa và Tài tinh. Con người đa tài, giao tiếp khéo léo, mang tham vọng vươn lên mạnh mẽ. Dễ bạo phát qua kinh doanh, giải trí. Cần chú ý cân bằng cảm xúc, tránh để tham vọng lấn át sự bình yên.",
  "Cự Môn":"Ám tinh chủ về ngôn từ. Khả năng phân tích sắc sảo nhưng hay hoài nghi. Có tài hùng biện, rất hợp với nghề luật sư, tư vấn, giáo viên. Cần khéo léo trong lời ăn tiếng nói để tránh thị phi.",
  "Thiên Tướng":"Ấn tinh mang phong thái uy nghi. Đường bệ, thích giúp đỡ người khác, trọng chữ tín. Rất chú trọng hình thức và có gu thẩm mỹ cao. Làm việc bài bản, cẩn thận.",
  "Thiên Lương":"Thọ tinh mang bóng dáng người thầy. Hiền hậu, sống có nguyên tắc, thích che chở. Rất hợp với nghề giáo dục, y khoa. Cuộc đời hay gặp may mắn vào những lúc nguy nan nhất.",

const yearCan=y=>CAN[((y+6)%10+10)%10],yearChiI=y=>((y+8)%12+12)%12,yearName=y=>yearCan(y)+' '+CHI[yearChiI(y)];

/* ═══ AN SAO ═══ */

  const L=solar2Lunar(dd,mm,yy),ci=((L.year+6)%10+10)%10,canNam=CAN[ci],cN=yearChiI(L.year);

  const canCung=i=>CAN[(canDan+m12(i-2))%10];

  const n=Math.ceil(L.day/cuc),r=n*cuc-L.day,base=m12(1+n),tv=m12(r%2===1?base-r:base+r),ph=m12(4-tv),S={};

  const P={'Văn Xương':m12(10-gio),'Văn Khúc':m12(4+gio),'Tả Phụ':m12(3+L.month),'Hữu Bật':m12(11-L.month),
    'Địa Kiếp':m12(11+gio),'Địa Không':m12(11-gio),'Lộc Tồn':LOC_TON[canNam],
    'Kình Dương':m12(LOC_TON[canNam]+1),'Đà La':m12(LOC_TON[canNam]-1),
    'Thiên Khôi':KHOI_VIET[canNam][0],'Thiên Việt':KHOI_VIET[canNam][1]};
  const[lo,qu,kh,ky]=TU_HOA[canNam],HOA={};HOA[lo]='loc';HOA[qu]='quyen';HOA[kh]='khoa';HOA[ky]='ky';
  const duong=[0,2,4,6,8].includes(ci),thuan=(duong&&sex==='nam')||(!duong&&sex==='nu');
  const dv={};for(let i=0;i<12;i++)dv[m12(thuan?menh+i:menh-i)]=cuc+i*10;
  const off=m12(cN-ci),TUAN=[m12(10+off),m12(11+off)],tb=m12(8-(ci%5)*2),TRIET=[tb,m12(tb+1)];
  let sH,sL;
  if([2,6,10].includes(cN)){sH=1;sL=3;}else if([8,0,4].includes(cN)){sH=2;sL=10;}
  else if([5,9,1].includes(cN)){sH=3;sL=10;}else{sH=9;sL=10;}

  P['Thiên Mã']={8:2,0:2,4:2,2:8,6:8,10:8,5:11,9:11,1:11,11:5,3:5,7:5}[cN];
  P['Cô Thần']={11:2,0:2,1:2,2:5,3:5,4:5,5:8,6:8,7:8,8:11,9:11,10:11}[cN];
  P['Quả Tú']={11:10,0:10,1:10,2:1,3:1,4:1,5:4,6:4,7:4,8:7,9:7,10:7}[cN];

  const _TS=['Tràng Sinh','Mộc Dục','Quan Đới','Lâm Quan','Đế Vượng','Suy','Bệnh','Tử','Mộ','Tuyệt','Thai','Dưỡng'];

    ma:{8:2,0:2,4:2,2:8,6:8,10:8,5:11,9:11,1:11,11:5,3:5,7:5}[cX],
    khoc:m12(6-cX),hu:m12(6+cX),khoi:KHOI_VIET[canX][0],viet:KHOI_VIET[canX][1],
    hoa:(()=>{const[a,b,c,e]=TU_HOA[canX],H={};H[a]='loc';H[b]='quyen';H[c]='khoa';H[e]='ky';return H;})()};
  const lunarAge=xY-L.year+1;let daiVanCung=-1,daiVanStart=0;

    naNam:NA_TEN[NA_IDX[canNam+'-'+CHI[cN]]],daiVanCung,daiVanStart,daiVanCan,lunarAge,sex};
}

/* ═══ HỢP TUỔI ═══ */
const TAM_HOP=[[0,4,8],[1,5,9],[2,6,10],[3,7,11]];
const TU_HANH_XUNG=[[0,3,6,9],[1,4,7,10],[2,5,8,11]];
const LUC_HAI={0:7,7:0,1:6,6:1,2:5,5:2,3:4,4:3,8:11,11:8,9:10,10:9};
const LUC_HOP={0:1,1:0,2:11,11:2,3:10,10:3,4:9,9:4,5:8,8:5,6:7,7:6};
const TAM_TAI_MAP={"0,4,8":[2,3,4],"1,5,9":[11,0,1],"2,6,10":[8,9,10],"3,7,11":[5,6,7]};
function checkChi(a,b){const o=[];
  const th=TAM_HOP.find(g=>g.includes(a)&&g.includes(b));if(th&&a!==b)o.push({v:'good',t:G('Tam hợp','tam hợp'),why:`Cùng nhóm ${th.map(i=>CHI[i]).join(' – ')}.`});
  const tx=TU_HANH_XUNG.find(g=>g.includes(a)&&g.includes(b));if(tx&&a!==b)o.push({v:'bad',t:G('Tứ hành xung','tứ hành xung'),why:`Cùng nhóm ${tx.map(i=>CHI[i]).join(' – ')}.`});
  if(m12(a-b)===6)o.push({v:'bad',t:G('Lục xung','lục xung'),why:'Đối diện vòng chi.'});
  if(LUC_HAI[a]===b)o.push({v:'mid',t:G('Lục hại','lục hại'),why:'Hại nhau.'});
  if(LUC_HOP[a]===b)o.push({v:'good',t:G('Lục hợp','lục hợp'),why:'Hợp nhau.'});
  if(!o.length)o.push({v:'mid',t:'Bình hòa',why:'Không xung không hợp.'});return o;}
const SINH_H={'Kim':'Thủy','Thủy':'Mộc','Mộc':'Hỏa','Hỏa':'Thổ','Thổ':'Kim'};
const KHAC_H={'Kim':'Mộc','Mộc':'Thổ','Thổ':'Thủy','Thủy':'Hỏa','Hỏa':'Kim'};
const napAm=y=>{const i=NA_IDX[yearCan(y)+'-'+CHI[yearChiI(y)]];return{hanh:NAP_AM[i],ten:NA_TEN[i]};};
function checkNapAm(y1,y2){const a=napAm(y1),b=napAm(y2),base=`Nam <b>${a.ten}</b> (${a.hanh}) · Nữ <b>${b.ten}</b> (${b.hanh}). `;
  if(SINH_H[a.hanh]===b.hanh||SINH_H[b.hanh]===a.hanh)return{v:'good',t:G('Tương sinh','nạp âm'),why:base};
  if(KHAC_H[a.hanh]===b.hanh||KHAC_H[b.hanh]===a.hanh)return{v:'bad',t:G('Tương khắc','nạp âm'),why:base};
  return{v:'mid',t:G('Bình hòa','nạp âm'),why:base};}
const QUAI={1:'Khảm',2:'Khôn',3:'Chấn',4:'Tốn',6:'Càn',7:'Đoài',8:'Cấn',9:'Ly'},DONG_TU=['Khảm','Ly','Chấn','Tốn'];
const red=x=>{while(x>9)x=String(x).split('').reduce((a,b)=>a+ +b,0);return x;};
function cungPhi(y,sex){const s=red(String(y).slice(-2).split('').reduce((a,b)=>a+ +b,0));let n=sex==='nam'?(y<2000?10:9)-s:s+(y<2000?5:6);while(n>9)n-=9;if(n<=0)n+=9;return n===5?(sex==='nam'?'Khôn':'Cấn'):QUAI[n];}
function checkCungPhi(yB,yG){const b=cungPhi(yB,'nu'),g=cungPhi(yG,'nam'),same=(DONG_TU.includes(b))===(DONG_TU.includes(g));
  return{v:same?'good':'mid',t:G('Bát trạch','cung phi'),why:`Nam <b>${g}</b> · Nữ <b>${b}</b>. `+(same?'Cùng nhóm.':'Khác nhóm.')};}
function kimLau(yB,yL){const t=yL-yB+1,du=t%9,L={1:'Thân',3:'Thê',6:'Tử',8:'Lục Súc'};return{tuoiMu:t,du,pham:!!L[du],loai:L[du]||null};}
function tamTai(c,yL){const g=TAM_HOP.find(x=>x.includes(c)),nam=TAM_TAI_MAP[g.join(',')],cy=yearChiI(yL);return nam.includes(cy)?{pham:true,thu:nam.indexOf(cy)+1}:{pham:false};}

/* ═══ TRẠCH CÁT ═══ */
const TRUC=['Kiến','Trừ','Mãn','Bình','Định','Chấp','Phá','Nguy','Thành','Thu','Khai','Bế'];
const HOANG=[1,2,4,5,8,10];
const TAM_NUONG=[3,7,13,18,22,27],NGUYET_KY=[5,14,23],DUONG_CONG={1:[13],2:[11],3:[9],4:[7],5:[5],6:[3],7:[8,29],8:[27],9:[25],10:[23],11:[21],12:[19]};
const trucIdx=(mTh,dc)=>m12(dc-mTh);
function xetNgay(d,m,y,ctx){const L=solar2Lunar(d,m,y),dc=dayChiIdx(d,m,y),can=CAN[dayCanIdx(d,m,y)];
  const ti=trucIdx(L.month-1,dc),truc=TRUC[ti],hoang=HOANG.includes(ti);const xau=[];
  if(!hoang)xau.push(`hắc đạo (${truc})`);if(TAM_NUONG.includes(L.day))xau.push('tam nương');
  if(NGUYET_KY.includes(L.day))xau.push('nguyệt kỵ');if((DUONG_CONG[L.month]||[]).includes(L.day))xau.push('Dương Công kỵ');
  if(m12(dc-ctx.cB)===6)xau.push(`xung ${CHI[ctx.cB]}`);if(m12(dc-ctx.cG)===6)xau.push(`xung ${CHI[ctx.cG]}`);
  const gio=[];for(let h=0;h<12;h++)if(HOANG.includes(trucIdx(m12(dc-2),h)))gio.push(CHI[h]);
  return{d,m,y,L,can,chi:CHI[dc],truc,hoang,xau,gio,tot:xau.length===0};}

/* ═══ LUẬN GIẢI ═══ */
function luanMenh(K){
  const cN=yearChiI(K.L.year);
  const cucHanh = K.cuc === 2 ? 'Thủy' : K.cuc === 3 ? 'Mộc' : K.cuc === 4 ? 'Kim' : K.cuc === 5 ? 'Thổ' : 'Hỏa';
  const nh = NAP_AM[NA_IDX[K.canNam+'-'+CHI[cN]]];
  let menhCucText = "";
  if (nh === cucHanh) menhCucText = "Mệnh Cục bình hòa (cùng hành). Cuộc đời tương đối bình ổn, dễ hòa nhập với môi trường.";
  else if (SINH_H[nh] === cucHanh) menhCucText = "Mệnh sinh Cục. Bản mệnh hào phóng, hay lo toan cho hoàn cảnh, đôi lúc chịu thiệt thòi nhưng được người đời nể trọng.";
  else if (SINH_H[cucHanh] === nh) menhCucText = "Cục sinh Mệnh. Hoàn cảnh ưu ái, hay gặp may mắn, đi ra ngoài dễ được quý nhân hoặc môi trường nâng đỡ.";
  else if (KHAC_H[nh] === cucHanh) menhCucText = "Mệnh khắc Cục. Hoàn cảnh nhiều thử thách nhưng bản lĩnh đương số rất lớn, kiên cường khắc phục khó khăn để tự tay vươn lên thành tựu.";
  else if (KHAC_H[cucHanh] === nh) menhCucText = "Cục khắc Mệnh. Môi trường hay tạo áp lực. Cần sự nhẫn nại, ý chí bền bỉ để vượt qua nghịch cảnh.";
  const namAmDuong = cN % 2 === 0 ? 'Dương' : 'Âm';
  const cungAmDuong = K.menh % 2 === 0 ? 'Dương' : 'Âm';
  const amDuongLy = namAmDuong === cungAmDuong ? "Âm Dương thuận lý. Cuộc đời nhìn chung có nhiều điểm thuận lợi, dễ gặp thời vận, mưu sự dễ thành." : "Âm Dương nghịch lý. Nội lực mạnh mẽ, kiên cường. Dù gặp nhiều thử thách thăng trầm nhưng nhờ nỗ lực tự thân mà bứt phá vươn lên.";

  let t = '<h3 style="color:var(--gold);margin-top:0;font-size:18px;">☯ Tổng quan Bản mệnh & Cá tính</h3><ul style="padding-left:20px;margin-bottom:15px;line-height:1.7;">';
  t += `<li><b>Âm Dương - Ngũ Hành:</b> Đương số mang mệnh <b>${K.naNam}</b> (${nh}), <b>${CUC_TEN[K.cuc]}</b>. <b>${amDuongLy}</b> Thế <b>${menhCucText.split('.')[0]}</b>. ${menhCucText.split('. ').slice(1).join('. ')}</li>`;

  const ch=Object.keys(K.S).filter(s=>K.S[s]===K.menh),pu=Object.keys(K.P).filter(s=>K.P[s]===K.menh);
  if(!ch.length){
    t += `<li><b>Cung Mệnh (Vô Chính Diệu):</b> Bản mệnh linh hoạt, dễ thích nghi với hoàn cảnh. Thường ra ngoài sẽ năng động và phát huy được nhiều tiềm năng hơn ở nhà.</li>`;
    const di=m12(K.menh+6),chD=Object.keys(K.S).filter(s=>K.S[s]===di);
    if(chD.length){
      t += `<li><b>Thiên Di chiếu Mệnh:</b> Mượn <b>${chD.join(', ')}</b> từ cung đối diện. `;
      chD.forEach(s=>{if(PHAN_SAO[s])t+=PHAN_SAO[s]+' ';});
      t += `</li>`;
    }
  }else{
    t += `<li><b>Cung Mệnh (${ch.join(', ')} tọa thủ):</b> `;
    ch.forEach(s=>{if(PHAN_SAO[s])t+=PHAN_SAO[s]+' ';});
    t += `</li>`;
  }

  const tuanTriet=[];if(K.TUAN.includes(K.menh))tuanTriet.push('Tuần');if(K.TRIET.includes(K.menh))tuanTriet.push('Triệt');
  if(tuanTriet.length)t+=`<li><b>Tác động của ${tuanTriet.join(' - ')}:</b> Giai đoạn tiền vận (trước 30-35 tuổi) thường trải qua nhiều thử thách rèn giũa. Trung và hậu vận bứt phá mạnh mẽ. Tuần/Triệt cũng giúp hóa giải bớt hung tinh nếu có.</li>`;

  const catM = pu.filter(s=>['Thiên Khôi','Thiên Việt','Tả Phụ','Hữu Bật','Văn Xương','Văn Khúc','Lộc Tồn','Thiên Mã'].includes(s));
  const dh = pu.filter(s=>['Đào Hoa','Hồng Loan','Thiên Hỷ'].includes(s));
  if(catM.length || dh.length) {
    t += `<li><b>Cát tinh hội tụ (${[...catM, ...dh].join(', ')}):</b> Đương số `;
    if (dh.length) t += `vui vẻ, thu hút, có duyên ngầm. `;
    if (catM.includes('Thiên Khôi') || catM.includes('Thiên Việt')) t += `Sớm muộn cũng được quý nhân nâng đỡ. `;
    if (catM.includes('Văn Xương') || catM.includes('Văn Khúc')) t += `Có tư chất thông minh, học hành sáng dạ, nhiều hoa tay. `;
    if (catM.includes('Tả Phụ') || catM.includes('Hữu Bật')) t += `Có tài quán xuyến, hay được bạn bè trợ giúp. `;
    if (catM.includes('Lộc Tồn')) t += `Rất có lộc kinh tế, giỏi tích lũy. `;
    t += `</li>`;
  }

  const sat=pu.filter(s=>SAT_LIST.includes(s));
  if(sat.length)t+=`<li><span class="bad"><b>Sát tinh hội họp (${sat.join(', ')}):</b> Tính cách mang phần ngang ngạnh, quyết liệt, dám nghĩ dám làm. Tuy nhiên cần chú ý rèn giũa sự kiên nhẫn, tránh bốc đồng để không rơi vào cảnh bạo phát bạo tàn.</span></li>`;
  t += '</ul></div>';
  return '<div class="phan-box">'+t;
}

  let t=`Đương số <b>${K.lunarAge} tuổi</b> (âm), đang đi <b>Đại Vận cung ${cn}</b> (${K.canCung(p)} ${CHI[p]}), từ ${K.daiVanStart}–${K.daiVanStart+9} tuổi.<br><br>`;
  if(ch.length){t+=`Chính tinh thủ Đại Vận: <b>${ch.join(', ')}</b>. `;
    ch.forEach(s=>{if(PHAN_SAO[s])t+=PHAN_SAO[s].split('.')[0]+'. ';});t+='<br><br>';}
  else t+='Đại Vận vô chính diệu, vận trình uyển chuyển, phụ thuộc ngoại cảnh và quý nhân.<br><br>';

  if(satDV.length)t+=`Sát tinh trong Đại Vận: <b>${satDV.join(', ')}</b>. Giai đoạn đòi hỏi bản lĩnh và kiên nhẫn.<br><br>`;
  const catDV=pu.filter(s=>['Tả Phụ','Hữu Bật','Văn Xương','Văn Khúc','Thiên Khôi','Thiên Việt','Lộc Tồn'].includes(s));
  if(catDV.length)t+=`<span class="good"><b>Cát tinh phò tá:</b> ${catDV.join(', ')}.</span> Giúp đương số vượt qua khó khăn.<br><br>`;
  if(K.daiVanCan){const[lo,qu,kh,ky]=TU_HOA[K.daiVanCan];
    t+=`<b>Tứ Hóa Đại Vận</b> (can ${K.daiVanCan}): ${lo} Hóa Lộc · ${qu} Hóa Quyền · ${kh} Hóa Khoa · <b class="bad">${ky} Hóa Kỵ</b>.<br>`;
    const kyP=fsp(K,ky);if(kyP===K.menh)t+='<b class="bad">⚠ Hóa Kỵ Đại Vận phi về Mệnh!</b> Yếu tố hung hiểm.<br>';
    else if(kyP===m12(K.menh+6))t+='<b class="bad">⚠ Hóa Kỵ Đại Vận phi về Thiên Di xung chiếu Mệnh!</b><br>';}
  return`<div class="phan-box"><h3 style="color:var(--gold);margin-top:0;font-size:18px;">☳ LUẬN ĐẠI VẬN HIỆN TẠI</h3>${t}</div>`;}

function luanHanNam(K){
  const xY=K.LUU.nam,canX=CAN[((xY+6)%10+10)%10],[,,,kyNam]=TU_HOA[canX];
  const kyNamPos=fsp(K,kyNam),diPos=m12(K.menh+6);
  const factors=[];
  if(kyNamPos===K.menh)factors.push(`<b>${kyNam}</b> Hóa Kỵ năm nay phi trúng <b>cung Mệnh</b>.`);
  else if(kyNamPos===diPos)factors.push(`<b>${kyNam}</b> Hóa Kỵ tọa Thiên Di, <b>xung chiếu về Mệnh</b>.`);
  if(K.daiVanCung>=0){const chD=Object.keys(K.S).filter(s=>K.S[s]===K.daiVanCung),puD=Object.keys(K.P).filter(s=>K.P[s]===K.daiVanCung);
    const kyDV=chD.concat(puD).filter(s=>K.HOA[s]==='ky');
    if(kyDV.length)factors.push(`Gốc Đại Vận có <b>${kyDV.join(', ')}</b> Hóa Kỵ án ngữ.`);}
  const kkM=['Địa Không','Địa Kiếp'].filter(s=>K.P[s]===K.menh||K.P[s]===K.than);
  if(kkM.length&&K.daiVanCung>=0){const chD=Object.keys(K.S).filter(s=>K.S[s]===K.daiVanCung).concat(Object.keys(K.P).filter(s=>K.P[s]===K.daiVanCung));
    if(chD.some(s=>K.HOA[s]==='ky'))factors.push(`Mệnh/Thân có <b>${kkM.join(', ')}</b> (sát tinh bậc nhất) + đang đi Đại Vận Hóa Kỵ.`);}
  if(K.daiVanCan){const[,,,kyDVC]=TU_HOA[K.daiVanCan],kyDVCP=fsp(K,kyDVC);
    if(kyDVCP===K.menh&&kyNamPos!==K.menh)factors.push(`Can Đại Vận (${K.daiVanCan}) phi <b>${kyDVC}</b> Hóa Kỵ về Mệnh.`);}
  const satM=SAT_LIST.filter(s=>K.P[s]===K.menh);
  if(satM.length){const thP=K.LUU.tieuHan,chTH=Object.keys(K.S).filter(s=>K.S[s]===thP).concat(Object.keys(K.P).filter(s=>K.P[s]===thP));
    if(chTH.some(s=>K.HOA[s]==='ky'||K.LUU.hoa[s]==='ky'))factors.push(`Mệnh có sát tinh (${satM.join(', ')}), Tiểu Hạn năm nay gặp Hóa Kỵ.`);}
  const satTh=SAT_LIST.filter(s=>K.P[s]===K.than),hkTh=['Thiên Hình','Thiên Không'].filter(s=>K.P[s]===K.than);
  if(satTh.length&&hkTh.length)factors.push(`Thân có ${satTh.join(', ')} kèm ${hkTh.join(', ')}, năm Kỵ dễ kích phát.`);
  const tamHopM=[K.menh,m12(K.menh+4),m12(K.menh+8),m12(K.menh+6)];
  const rescues=[];const hoaLQK=[];
  Object.keys(K.HOA).forEach(s=>{const h=K.HOA[s],pos=fsp(K,s);
    if((h==='loc'||h==='quyen'||h==='khoa')&&tamHopM.includes(pos))hoaLQK.push(`${s} Hóa ${{loc:'Lộc',quyen:'Quyền',khoa:'Khoa'}[h]}`);});
  if(hoaLQK.length>=2)rescues.push(hoaLQK.join(', ')+' hội chiếu');
  if(tamHopM.includes(K.P['Thiên Khôi']))rescues.push('Thiên Khôi chiếu');
  if(tamHopM.includes(K.P['Thiên Việt']))rescues.push('Thiên Việt chiếu');
  let t=`Năm <b>${yearName(xY)}</b>, <b class="bad">${kyNam} Hóa Kỵ</b>.<br><br>`;
  if(!factors.length){t+=`<span class="good">✓ Không phát hiện yếu tố hung hiểm nào.</span> Năm bình an, mọi việc thuận tự nhiên.<br>`;}
  else{t+=`<b class="bad">Phát hiện ${factors.length}/6 yếu tố hung hiểm:</b><br>`;
    factors.forEach(f=>t+=`<span class="bad">✗</span> ${f}<br>`);t+='<br>';
    if(factors.length===1)t+='Một yếu tố hung – năm có lúc vất vả nhưng vẫn kiểm soát được.';
    else if(factors.length<=3)t+=`<b>Chồng ${factors.length} tầng Hóa Kỵ</b> – năm hung hiểm, cần đề phòng sức khỏe, công việc, pháp lý. Hạn chế mạo hiểm.`;
    else t+=`<b class="bad">Hạn cực nặng!</b> Chồng ${factors.length} tầng Hóa Kỵ. Hết sức cẩn trọng, tránh mọi rủi ro. Nên tích cực hành thiện, tích đức.`;
    t+='<br><br>';
    if(rescues.length){t+=`<span class="good"><b>Cứu giải:</b> ${rescues.join('; ')}.</span> Tuy gặp hạn xấu nhưng vẫn có đường thoát. `;
      if(hoaLQK.length>=3)t+='<b class="good">Đủ Tam Hóa (Khoa-Quyền-Lộc) – sức cứu giải rất mạnh, phùng hung hóa cát.</b>';}
    else if(factors.length>=2)t+='<span class="bad">Không tìm thấy bộ sao cứu giải mạnh hội chiếu Mệnh.</span> Đương số nên chủ động phòng ngừa, tích phúc đức.';}
  return`<div class="phan-box"><h3 style="color:var(--gold);margin-top:0;font-size:18px;">☵ XEM HẠN NĂM ${xY}</h3>${t}</div>`;}

  H+=`</tbody></table><h3>Trạch Cát (Ngày đẹp)</h3>`;
  DAYS=[];const months=[];

    el.dataset.chi=i;el.tabIndex=0;el.style.animationDelay=(GRID.indexOf(i)*28)+'ms';
    const ch=Object.keys(K.S).filter(s=>K.S[s]===i),pu=Object.keys(K.P).filter(s=>K.P[s]===i);
    const tg=s=>K.HOA[s]?`<span class="hoa ${K.HOA[s]}">${{loc:'LỘC',quyen:'QUYỀN',khoa:'KHOA',ky:'KỴ'}[K.HOA[s]]}</span>`:'';
    const mh=s=>{if(!MVDH[s])return'';const v=MVDH[s][i],kiem=MH_DAKIEM.has(s+CHI[i]);return`<span class="mh ${v==='Đ'?'D':v} ${kiem?'':'chua'}">${v}</span>`;};
    let tt='';
    if(K.TUAN.includes(i))tt+='<span class="tt-tag tuan">TUẦN</span>';
    if(K.TRIET.includes(i))tt+='<span class="tt-tag triet">TRIỆT</span>';
    if(K.LUU.tieuHan===i)tt+='<span class="tt-tag lh">TIỂU HẠN</span>';
    if(K.LUU.thaiTue===i)tt+='<span class="tt-tag lt">L.THÁI TUẾ</span>';
    if(K.daiVanCung===i)tt+='<span class="tt-tag dv">ĐẠI VẬN</span>';
    const lw=[];
    if(K.LUU.loc===i)lw.push('<span class="s luu">L.Lộc Tồn</span>');
    if(K.LUU.kinh===i)lw.push('<span class="s luu sat">L.Kình Dương</span>');
    if(K.LUU.da===i)lw.push('<span class="s luu sat">L.Đà La</span>');
    if(K.LUU.ma===i)lw.push('<span class="s luu">L.Thiên Mã</span>');
    if(K.LUU.khoc===i)lw.push('<span class="s luu sat">L.Thiên Khốc</span>');
    if(K.LUU.hu===i)lw.push('<span class="s luu sat">L.Thiên Hư</span>');
    if(K.LUU.khoi===i)lw.push('<span class="s luu">L.Thiên Khôi</span>');
    if(K.LUU.viet===i)lw.push('<span class="s luu">L.Thiên Việt</span>');
    [...ch,...pu].forEach(sn=>{const h=K.LUU.hoa[sn];
      if(h)lw.push(`<span class="s luu ${h==='ky'?'sat':''}">L.Hóa ${{loc:'Lộc',quyen:'Quyền',khoa:'Khoa',ky:'Kỵ'}[h]}</span>`);});
    el.innerHTML=`<div class="top"><span class="tl"><span class="ten">${CUNG12[m12(i-K.menh)]}</span>${tt}</span><span class="cc">${K.canCung(i)} ${CHI[i]}</span></div>
      <div class="stars">${ch.map(s=>`<span class="s chinh">${s}${mh(s)}${tg(s)}</span>`).join('')}
      ${pu.map(s=>`<span class="s phu ${SAT_LIST.includes(s)?'sat':CAT_LIST.includes(s)?'cat':''}">${s}${tg(s)}</span>`).join('')}${lw.join('')}</div>
      <div class="vong-group"><span class="s vong">${K.V_TS[i]}</span><span class="s vong">${K.V_TT[i]}</span><span class="s vong">${K.V_BS[i]}</span></div>
      <div class="van"><span>${K.dv[i]}</span><span>${CHI[i]}</span></div>`;
    el.onclick=()=>{SEL=(SEL===i?null:i);paint();};
    ban.appendChild(el);
  });
  document.getElementById('outLaso').innerHTML=luanMenh(K)+luanCacCung(K)+luanDaiVan(K)+luanHanNam(K);
}
function paint(){document.querySelectorAll('#ban .cung').forEach(c=>{const j=+c.dataset.chi;
  c.classList.toggle('focus',SEL!==null&&j===SEL);
  c.classList.toggle('tamhop',SEL!==null&&j!==SEL&&(j===m12(SEL+4)||j===m12(SEL+8)));
  c.classList.toggle('xung',SEL!==null&&j===m12(SEL+6));});}
function center(K){const c=document.createElement('div');c.id='center';
  c.innerHTML=`<h2>☯ LÁ SỐ TỬ VI</h2>
   <div class="row"><span>Âm lịch</span><span>${K.L.day}/${K.L.month}${K.L.leap?' (nhuận)':''}/${K.L.year}</span></div>
   <div class="row"><span>Năm sinh</span><span>${K.canNam} ${K.chiNam}</span></div>
   <div class="row"><span>Nạp âm</span><span>${K.naNam}</span></div>
   <div class="row hl"><span>Cục</span><span>${CUC_TEN[K.cuc]}</span></div>
   <div class="row"><span>Mệnh cư</span><span>${CHI[K.menh]}</span></div>
   <div class="row"><span>Thân cư</span><span>${CUNG12[m12(K.than-K.menh)]}</span></div>
   <div class="row hl"><span>Năm xem</span><span>${yearName(K.LUU.nam)}</span></div>
   <div class="row"><span>Tuổi (âm)</span><span>${K.lunarAge}</span></div>`;return c;}

const HOANG_OC=[{t:'Nhất Cát',v:'good'},{t:'Nhị Nghi',v:'good'},{t:'Tam Địa Sát',v:'bad'},{t:'Tứ Tấn Tài',v:'good'},{t:'Ngũ Thọ Tử',v:'bad'},{t:'Lục Hoang Ốc',v:'bad'}];
function runNha(){
  const v=document.getElementById('nDob').value,yX=+document.getElementById('nY').value;if(!v||!yX)return;
  const[y,m,dd]=v.split('-').map(Number),lb=solar2Lunar(dd,m,y),t=yX-lb.year+1;saveURL();
  const ho=HOANG_OC[(t-10)%6],kl=kimLau(lb.year,yX),tt=tamTai(yearChiI(lb.year),yX);
  let H=`<div class="tally"><div class="big">Gia chủ ${yearName(lb.year)} · Xây năm ${yearName(yX)} (Tuổi ${t})</div></div>`;
  const row=(t2,vv,why)=>`<div class="card"><div class="hd"><span class="t">${t2}</span><span class="v ${vv}">${vv==='good'?'Cát':'Hung'}</span></div><div class="why">${why}</div></div>`;
  H+=row(G('Hoang Ốc','hoang ốc')+' — '+ho.t,ho.v,`Rơi vào cung <b>${ho.t}</b>.`);
  H+=row(G('Kim Lâu','kim lâu'),kl.pham?'bad':'good',kl.pham?`Phạm ${kl.loai}.`:'Không phạm.');
  H+=row(G('Tam tai','tam tai'),tt.pham?'bad':'good',tt.pham?`Năm thứ ${tt.thu}/3.`:'Không phạm.');
  const xau=[ho.v==='bad',kl.pham,tt.pham].filter(Boolean).length;let lb2='';
  if(!xau)lb2="Năm vô cùng thuận lợi để động thổ, xây nhà. Mọi sự cát tường.";
  else if(xau===1)lb2="Có một vướng mắc nhỏ, có thể tự đứng ra làm hoặc mượn tuổi cho chắc.";
  else lb2="Năm nay phạm kỵ nhiều, gia chủ không nên tự đứng ra động thổ, bắt buộc phải mượn tuổi.";
  H+=`<div class="phan-box"><b>LỜI BÀN:</b><br><br>${lb2}</div>`;
  document.getElementById('outNha').innerHTML=H;}
document.getElementById('btnNha').onclick=runNha;

function runMa(){
  const a=document.getElementById('maDob').value,b=document.getElementById('maDeath').value;if(!a||!b)return;
  const[y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);
  const sex=document.getElementById('maSex').value,gio=+document.getElementById('maHour').value;
  const lb=solar2Lunar(d1,m1,y1),ld=solar2Lunar(d2,m2,y2),t=ld.year-lb.year+1;saveURL();
  const buoc=sex==='nam'?1:-1,khoi=sex==='nam'?2:8;
  const cT=m12(khoi+(Math.floor(t/10)*buoc)+(((t%10)===0?0:(t%10)-1)*buoc));
  const cTh=m12(cT+ld.month*buoc),cN=m12(cTh+ld.day*buoc),cG=m12(cN+(gio+1)*buoc);
  const loai=c=>[2,8,5,11].includes(c)?['Trùng tang','bad']:[0,6,3,9].includes(c)?['Thiên di','mid']:['Nhập mộ','good'];
  let H=`<div class="tally"><div class="big">Mất ${ld.day}/${ld.month} năm ${yearName(ld.year)} · Thọ ${t} tuổi</div></div>`;
  [['Tuổi',t,cT],['Tháng',ld.month,cTh],['Ngày',ld.day,cN],['Giờ',CHI[gio],cG]]
    .forEach(([n,v,c])=>{const[ten,cls]=loai(c);
      H+=`<div class="card"><div class="hd"><span class="t">${n} ${v} <b>→ ${CHI[c]}</b></span><span class="v ${cls}">${ten}</span></div></div>`;});
  document.getElementById('outMa').innerHTML=H;}
document.getElementById('btnMa').onclick=runMa;

/* ═══ TOOLTIP ═══ */
const tip=document.getElementById('tip');
document.addEventListener('click',e=>{const g=e.target.closest('.gl');
  if(!g){tip.style.display='none';return;}
  tip.innerHTML=`<b>${g.textContent}</b><br>${GLOSS[g.dataset.g]||''}`;tip.style.display='block';
  const r=g.getBoundingClientRect();
  tip.style.left=Math.max(8,Math.min(r.left,innerWidth-tip.offsetWidth-8))+'px';
  tip.style.top=(r.bottom+8+tip.offsetHeight>innerHeight?r.top-tip.offsetHeight-8:r.bottom+8)+'px';});

/* ═══ URL STATE ═══ */
function saveURL(){try{const p=new URLSearchParams({b:document.getElementById('bDob').value,g:document.getElementById('gDob').value,
  y1:document.getElementById('y1').value,y2:document.getElementById('y2').value,l:document.getElementById('lDob').value,
  h:document.getElementById('lHour').value,s:document.getElementById('lSex').value,xy:document.getElementById('lXemY').value,
  nb:document.getElementById('nDob').value,ns:document.getElementById('nSex').value,ny:document.getElementById('nY').value,
  ma1:document.getElementById('maDob').value,ma2:document.getElementById('maDeath').value,mah:document.getElementById('maHour').value,
  mas:document.getElementById('maSex').value,t:document.querySelector('.tab.on').dataset.tab});
  history.replaceState(null,'','?'+p);}catch(e){}}
function loadURL(){const p=new URLSearchParams(location.search);if(![...p].length)return;
  const set=(id,k)=>{if(p.get(k)!==null)document.getElementById(id).value=p.get(k);};
  set('bDob','b');set('gDob','g');set('y1','y1');set('y2','y2');set('lDob','l');set('lHour','h');
  set('lSex','s');set('lXemY','xy');set('nDob','nb');set('nSex','ns');set('nY','ny');
  set('maDob','ma1');set('maDeath','ma2');set('maHour','mah');set('maSex','mas');
  const tb=p.get('t')&&document.querySelector(`[data-tab="${p.get('t')}"]`);if(tb)tb.click();}

/* ═══ KHỞI TẠO ═══ */
const sh=document.getElementById('lHour'),mah=document.getElementById('maHour');
CHI.forEach((c,i)=>{const a=(i*2+23)%24,b=(i*2)%24;
  const o=`<option value="${i}">${c} (${String(a).padStart(2,'0')}h–${String(b).padStart(2,'0')}h59)</option>`;
  sh.innerHTML+=o;mah.innerHTML+=o;});
sh.value=7;mah.value=7;
document.querySelectorAll('.tab').forEach(t=>{t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  ['cuoi','laso','nha','ma'].forEach(id=>document.getElementById('pane-'+id).classList.toggle('hide',t.dataset.tab!==id));saveURL();};});
document.getElementById('btnCuoi').onclick=runCuoi;
document.getElementById('btnLaso').onclick=runLaso;
loadURL();runCuoi();runLaso();runNha();runMa();
</script>
</body>
