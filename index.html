<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ngũ Trụ Khuyết Mệnh - Phân Tích Bát Tự</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
/* CSS bổ sung cho Ngũ Trụ */
.tru-table { width:100%; margin-bottom:20px; border-collapse:collapse; color:#fff; }
.tru-table th { padding:10px; border-bottom:1px solid var(--gold); }
.tru-table td { padding:10px; border-bottom:1px solid rgba(255,255,255,0.1); }
#capture-area { background:var(--void); padding:30px; border:2px solid var(--gold); border-radius:8px; max-width:800px; margin:0 auto; }
</style>
</head>
<body>
<div id="sao"></div>
<div id="suong"><i></i><i></i><i></i></div>
<div class="wrap">
<header>
  <div class="bagua">☰ ☱ ☲ ☳ ☴ ☵ ☶ ☷</div>
  <h1>NGŨ TRỤ KHUYẾT MỆNH</h1>
  <div class="sub">T H Ấ U &nbsp; H I Ể U &nbsp; B Ả N &nbsp; M Ệ N H &nbsp;·&nbsp; C Â N &nbsp; B Ằ N G &nbsp; N G Ũ &nbsp; H À N H</div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="nhap">📝 Nhập thông tin</div>
  <div class="tab" data-tab="ketqua">☯ Kết Quả Ngũ Trụ</div>
</div>

<div id="pane-nhap">
  <div class="panel" style="max-width:500px;margin:0 auto;">
    <div class="f">
        <label>Họ và tên</label>
        <input type="text" id="lName" placeholder="VD: Nguyễn Văn A">
    </div>
    <div class="f">
        <label>Ngày sinh (Dương lịch)</label>
        <input type="date" id="lDob" value="1998-02-01">
    </div>
    <div class="f">
        <label>Giờ sinh</label>
        <select id="lHour">
            <option value="0">Tý (23h - 01h)</option>
            <option value="2">Sửu (01h - 03h)</option>
            <option value="4">Dần (03h - 05h)</option>
            <option value="6">Mão (05h - 07h)</option>
            <option value="8">Thìn (07h - 09h)</option>
            <option value="10">Tỵ (09h - 11h)</option>
            <option value="12" selected>Ngọ (11h - 13h)</option>
            <option value="14">Mùi (13h - 15h)</option>
            <option value="16">Thân (15h - 17h)</option>
            <option value="18">Dậu (17h - 19h)</option>
            <option value="20">Tuất (19h - 21h)</option>
            <option value="22">Hợi (21h - 23h)</option>
        </select>
    </div>
    <div class="f">
        <label>Giới tính</label>
        <select id="lSex"><option value="1">Nam</option><option value="0">Nữ</option></select>
    </div>
    <div style="text-align:center;margin-top:20px;">
        <button type="button" id="btnLaso" style="padding:12px 30px;font-size:18px;">Phân Tích Ngũ Trụ ➔</button>
    </div>
  </div>
</div>

<div id="pane-ketqua" class="hide" style="text-align:center;">
    <div id="capture-area">
        <h2 style="color:var(--gold);margin-bottom:10px;font-size:24px;">BIỂU ĐỒ NGŨ TRỤ KHUYẾT MỆNH</h2>
        <div id="user-info" style="color:#ddd;margin-bottom:20px;font-size:16px;"></div>
        
        <table class="tru-table">
            <thead>
                <tr>
                    <th>Trụ</th>
                    <th>Thiên Can</th>
                    <th>Địa Chi</th>
                </tr>
            </thead>
            <tbody id="tru-table">
            </tbody>
        </table>

        <div style="width:100%;max-width:400px;margin:0 auto 20px;">
            <canvas id="nguHanhChart"></canvas>
        </div>

        <div id="khuyet-result" style="background:rgba(255,0,0,0.1);border-left:4px solid var(--cinnabar);padding:15px;text-align:left;margin-bottom:15px;">
        </div>
    </div>
    
    <div style="margin-top:20px;">
        <button id="btnDownload" style="background:var(--gold);color:#000;border:none;padding:12px 24px;border-radius:4px;cursor:pointer;font-weight:bold;font-size:16px;margin-bottom:15px;">📸 Tải Ảnh Biểu Đồ</button>
        <br>
        <a href="https://zalo.me/0366110096" target="_blank" style="display:inline-block;background:var(--azure);color:#000;padding:12px 24px;text-decoration:none;font-weight:bold;border-radius:4px;font-size:16px;">💬 Liên Hệ Thầy Thục Linh Tư Vấn Bù Khuyết</a>
    </div>
</div>

<footer>
  <button onclick="navigator.clipboard.writeText(location.href);this.textContent='✓ Đã copy link!'">📋 Chia sẻ</button>
  <div>☯ Ngũ Trụ Khuyết Mệnh · Đức năng thắng số ☯</div>
</footer>
</div>

<!-- Libraries -->
<script src="https://unpkg.com/lunar-javascript/lunar.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- App logic -->
<script src="assets/js/data.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/ui.js"></script>
</body>
</html>
